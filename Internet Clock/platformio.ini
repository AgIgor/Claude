; Internet Clock v6 - ESP-01 (1MB) + 29 LEDs WS2812 + AHT10 + BH1750
;
; Primeira gravação: via serial (env:esp01_1m)
; Depois: OTA pela página web (Sistema > Atualizar firmware) ou via env:ota

[platformio]
default_envs = esp01_1m

[env:esp01_1m]
platform = espressif8266
board = esp01_1m
framework = arduino
; 1MB sem sistema de arquivos: ~500KB por slot de firmware, necessário para OTA
board_build.ldscript = eagle.flash.1m.ld
board_build.f_cpu = 80000000L
build_flags =
    -D FW_VERSION=\"6.0.0\"
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
lib_deps =
    makuna/NeoPixelBus @ ^2.8.3
    bblanchon/ArduinoJson @ ^7.2.1
    256dpi/MQTT @ ^2.5.2
upload_speed = 115200
monitor_speed = 115200

; Atualização via rede: pio run -e ota -t upload
; Se definiu senha de administrador na página web, descomente upload_flags.
[env:ota]
extends = env:esp01_1m
upload_protocol = espota
upload_port = relogio.local
;upload_flags = --auth=SUA_SENHA
