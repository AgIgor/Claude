; Esp_BCM - Prototipo de modulo de carroceria (BCM) sem fio com ESP32 + ESP-NOW
;
; Dois firmwares no mesmo projeto:
;   pio run -e central -t upload     -> ESP32 central (botoes do painel)
;   pio run -e door    -t upload     -> ESP32 de porta (o MESMO firmware nas 4 portas;
;                                       a posicao e definida pelos jumpers de codificacao)

[platformio]
default_envs = central, door

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall

[env:central]
build_src_filter = +<central/>
upload_port = COM4

[env:door]
build_src_filter = +<door/>
upload_port = COM8
