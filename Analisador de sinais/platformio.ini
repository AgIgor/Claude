; ACRemote: controle local do ar-condicionado Electrolux por página web, com modos salvos e
; programação por horário. O ESP32 também tem o monitor da serial; o ESP-01 só faz o controle.
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<*> -<esp01/>
build_flags = -DCORE_DEBUG_LEVEL=0 -DWEBSOCKETS_TCP_TIMEOUT=1000
lib_deps =
  links2004/WebSockets@^2.4.1

; Grava pela rede: pio run -e ota -t upload
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = acremote.local
upload_flags = --auth=analisador

; ESP-01 de 1 MB: pio run -e esp01
[env:esp01]
platform = espressif8266
board = esp01_1m
framework = arduino
board_build.ldscript = eagle.flash.1m.ld
board_build.flash_mode = dout  ; o padrão da placa é qio, que o ESP-01 não garante
extra_scripts = pre:tools/gzip_pages.py
upload_speed = 115200
build_src_filter = +<ac_protocol.cpp> +<ac_commands.cpp> +<ac_schedule.cpp> +<esp01/>
build_flags = -Isrc/esp01

; Grava o ESP-01 pela rede: pio run -e esp01_ota -t upload
[env:esp01_ota]
extends = env:esp01
upload_protocol = espota
upload_port = acremote.local
upload_flags = --auth=analisador
