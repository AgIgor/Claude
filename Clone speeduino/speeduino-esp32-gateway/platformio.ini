; Gateway WiFi para Speeduino
; Lê os dados em tempo real pela serial secundária da ECU e serve um painel web.
;
; Compilar e gravar:
;   pio run -e esp32dev -t upload        (firmware)
;   pio run -e esp32dev -t uploadfs      (página web em data/ -> LittleFS)

[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    esp32async/AsyncTCP
    esp32async/ESPAsyncWebServer

[env:esp32dev]
board = esp32dev

[env:esp32-s3]
board = esp32-s3-devkitc-1
