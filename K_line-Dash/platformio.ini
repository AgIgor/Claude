; Dash web OBD CAN - Ford Fiesta 2004 (Magneti Marelli IAW 4AFR.BR) com MCP2515
; Backup da versão K-line em backup_kline/
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = -DCORE_DEBUG_LEVEL=0
lib_deps =
  autowp/autowp-mcp2515@^1.2.1
  links2004/WebSockets@^2.4.1
