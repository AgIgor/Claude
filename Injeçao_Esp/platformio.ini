; ECU ESP32 - injecao e ignicao programavel
; env:ecu        -> firmware da ECU (ESP32 WROOM DevKit)
; env:simulador  -> gerador de roda fonica 60-2 + fase para testes de bancada (segundo ESP32)
; env:simulador_uno -> mesmo simulador para Arduino Uno

[platformio]
default_envs = ecu

[env:ecu]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_src_filter = +<*> -<sim/>
extra_scripts = pre:tools/embed_web.py
build_flags =
    -O2
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
lib_deps =
    ESP32Async/AsyncTCP@^3.3.2
    ESP32Async/ESPAsyncWebServer@^3.7.0
    bblanchon/ArduinoJson@^7.2.0

[env:simulador]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<sim/>

[env:simulador_uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<sim/>
